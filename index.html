<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E-3904/05 concept</title>
<style>
:root {
  --bg:#071018; --panel:#101b26f4; --panel2:#142333; --line:#2e4356;
  --txt:#edf4fb; --muted:#9fb2c4; --accent:#8bd34a; --blue:#67b8ff; --gold:#ffd75d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0b1520,#050a0f);color:var(--txt)}
body{overflow-x:hidden}
header{position:sticky;top:0;z-index:50;background:#08111adf;backdrop-filter:blur(10px);border-bottom:1px solid #233748;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .title{font-weight:900;margin-right:auto}
header .sub{font-size:12px;color:var(--muted)}
button.ui{border:1px solid #38516a;background:#132333;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}
button.ui.active{border-color:var(--accent);box-shadow:0 0 0 2px #8bd34a24 inset}
.wrap{max-width:1280px;margin:0 auto;padding:14px}
.stage-shell{background:#0d1720;border:1px solid #25394a;border-radius:20px;padding:10px;box-shadow:0 18px 45px #0006}
.stage{position:relative;aspect-ratio:1280/885;overflow:hidden;border-radius:14px;background:#333}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.lamp{position:absolute;z-index:5;transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:4px;cursor:pointer}
.bulb{font-size:17px;line-height:1;opacity:.76;filter:saturate(.8);transition:.16s ease}
.tag{opacity:0;transform:translateX(-5px);transition:.16s ease;white-space:nowrap;background:#07111dde;border:1px solid #3b5872;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;color:#fff;pointer-events:none}
.lamp:hover .tag,.lamp.active .tag{opacity:1;transform:translateX(0)}
.lamp:hover .bulb,.lamp.active .bulb{opacity:1;transform:scale(1.12)}
.info-panel{position:fixed;right:16px;top:70px;z-index:80;width:min(500px,calc(100vw - 32px));max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:var(--panel);border:1px solid #3a5066;border-radius:18px;box-shadow:0 28px 80px #000a;backdrop-filter:blur(12px);transform:translateX(calc(100% + 35px));opacity:0;transition:.22s ease;overflow:hidden}
.info-panel.open{transform:translateX(0);opacity:1}
.info-panel.switching{transform:translateX(calc(100% + 20px));opacity:.15}
.info-panel.minimized{max-height:62px}
.info-panel.minimized .body,.info-panel.minimized .actions,.info-panel.minimized .subtitle,.info-panel.minimized .edit-hint{display:none}
.head{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 14px 11px;border-bottom:1px solid #2b3e50}
.head h2{margin:0;font-size:20px;line-height:1.15}
.subtitle{color:var(--muted);font-size:12px;line-height:1.4;margin-top:4px}
.headbtns{display:flex;gap:6px}
.iconbtn{width:35px;height:35px;border-radius:10px;border:1px solid #385069;background:#132333;color:#fff;cursor:pointer}
.edit-hint{display:none;padding:9px 14px;background:#0c243a;color:#c2e1ff;border-bottom:1px solid #2b3e50;font-size:12px}
.editmode .edit-hint{display:block}
.body{padding:15px 17px 22px;overflow:auto;line-height:1.54}
.body h3{font-size:15px;color:#d8edff;margin:17px 0 7px}
.body h3:first-child{margin-top:0}
.body p{margin:7px 0}
.body ul{padding-left:20px}
.body li{margin:6px 0}
.eq,.flow{margin:10px 0;padding:11px 13px;border-radius:12px;background:#081522;border:1px solid #35536e;font-weight:800;overflow-x:auto}
.flow{white-space:normal;color:#d9f0ff}
.note{margin-top:12px;padding:11px 12px;border-radius:12px;background:#142313;border:1px solid #4e7b3b66}
.compare,.process-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.compare>div,.process-grid>div{padding:11px;border-radius:12px;background:#0c1823;border:1px solid #2a4053}
.process-grid span{color:#8bd34a;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 14px;border-top:1px solid #2b3e50;background:#0b141d}
.actions button{flex:1 1 auto}
[contenteditable=true]{outline:2px dashed #67b8ff88;outline-offset:6px;border-radius:7px}
.bottom{position:fixed;z-index:40;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;background:#08121ce8;border:1px solid #2b4053;border-radius:14px;padding:7px;backdrop-filter:blur(10px)}
.toast{position:fixed;z-index:120;left:50%;bottom:72px;transform:translate(-50%,15px);opacity:0;transition:.18s ease;background:#0d1b28;border:1px solid #4a687f;padding:9px 13px;border-radius:999px}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){
  .wrap{padding:8px}
  .info-panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:72vh;transform:translateY(calc(100% + 25px))}
  .info-panel.open{transform:translateY(0)}
  .info-panel.switching{transform:translateY(calc(100% + 12px));opacity:.2}
  .tag{display:none}
  .bulb{font-size:14px}
  .bottom{bottom:78px}
  .compare,.process-grid{grid-template-columns:1fr}
}
</style>

  border:1px solid #5f9d43;

  padding:11px 14px;

<script>
const DATA = {"e3904": {"title": "E-3904 — Absorvedora Primária", "subtitle": "Recupera C₃/C₄ e hidrocarbonetos condensáveis do gás.", "html": "\n        <h3>Objetivo da E-3904</h3>\n        <p>A <strong>E-3904</strong> é a absorvedora primária da seção de concentração de gases. Sua função é <strong>recuperar hidrocarbonetos condensáveis</strong> presentes no gás, principalmente C₃, C₄ e parte dos C₅+, evitando que sejam perdidos junto com o gás combustível.</p>\n\n        <h3>Como ocorre a absorção?</h3>\n        <p>O processo é predominantemente <strong>físico</strong>, por transferência de massa e equilíbrio gás–líquido. Não há uma reação química principal na absorção.</p>\n\n        <div class=\"eq\">C₃H₈(g) ⇌ C₃H₈(l)</div>\n        <div class=\"eq\">C₃H₆(g) ⇌ C₃H₆(l)</div>\n        <div class=\"eq\">C₄H₁₀(g) ⇌ C₄H₁₀(l)</div>\n        <div class=\"eq\">C₄H₈(g) ⇌ C₄H₈(l)</div>\n\n        <p>Os componentes mais condensáveis migram do gás para o líquido absorvedor. Em geral, <strong>temperaturas mais baixas favorecem a absorção</strong>.</p>\n\n        <h3>Resultado esperado</h3>\n        <ul>\n          <li>Gás de topo mais pobre em C₃/C₄ e gasolina.</li>\n          <li>Líquido mais rico em C₃/C₄, enviado à etapa de retificação.</li>\n          <li>Maior recuperação de GLP e hidrocarbonetos valiosos.</li>\n        </ul>\n\n        <div class=\"note\"><strong>Memorização:</strong> E-3904 = “não deixar o GLP escapar pelo gás”.</div>\n        "}, "gas_debut": {"title": "Gasolina desbutanizada — Absorvente leve", "subtitle": "Corrente lean que aumenta a força motriz para absorção de C₃/C₄.", "html": "\n        <h3>Por que usar gasolina desbutanizada?</h3>\n        <p>A gasolina desbutanizada já perdeu grande parte dos seus componentes mais leves. Por isso, chega à E-3904 relativamente <strong>pobre em C₃/C₄</strong> e com capacidade para absorver esses componentes do gás.</p>\n\n        <h3>Princípio</h3>\n        <div class=\"eq\">C₃/C₄ no gás → C₃/C₄ dissolvidos na gasolina</div>\n\n        <p>Quanto maior a diferença entre a concentração de C₃/C₄ no gás e no líquido absorvedor, maior tende a ser a <strong>força motriz de transferência de massa</strong>.</p>\n\n        <h3>Função operacional</h3>\n        <ul>\n          <li>Recuperar propano e propeno.</li>\n          <li>Recuperar butanos e butenos.</li>\n          <li>Reduzir perdas de GLP pelo gás de topo.</li>\n        </ul>\n\n        <div class=\"note\"><strong>Resumo:</strong> gasolina desbutanizada = absorvente mais leve, especialmente importante para recuperação de C₃/C₄.</div>\n        "}, "j3905_oil": {"title": "Óleo da J-3905 A/B — Absorvente mais pesado", "subtitle": "Complementa a absorção e ajuda a reter hidrocarbonetos mais pesados.", "html": "\n        <h3>Função no processo</h3>\n        <p>A corrente proveniente da <strong>J-3905 A/B</strong> atua como um absorvente mais pesado. Por possuir menor volatilidade que a gasolina, tende a permanecer melhor na fase líquida e a auxiliar na retenção de hidrocarbonetos mais pesados.</p>\n\n        <h3>Diferença para a gasolina desbutanizada</h3>\n        <div class=\"compare\">\n          <div><strong>Gasolina desbutanizada</strong><br>Mais leve e lean em C₃/C₄.<br>Maior foco na recuperação de GLP.</div>\n          <div><strong>Óleo J-3905</strong><br>Mais pesado e menos volátil.<br>Absorção complementar e retenção de HC mais pesados.</div>\n        </div>\n\n        <h3>Fenômeno predominante</h3>\n        <p>Também se trata principalmente de <strong>solubilização física</strong>, e não de reação química.</p>\n\n        <div class=\"eq\">HC(g) ⇌ HC dissolvido no óleo(l)</div>\n\n        <div class=\"note\"><strong>Resumo:</strong> o óleo pesado funciona como absorvente complementar, ajudando a minimizar arraste/perdas de hidrocarbonetos.</div>\n        "}, "e3905": {"title": "E-3905 — Retificadora", "subtitle": "Remove componentes muito leves do líquido rico e preserva C₃/C₄.", "html": "\n        <h3>Objetivo da E-3905</h3>\n        <p>A <strong>E-3905</strong> executa a retificação/stripping do líquido proveniente da absorção. Ela remove os componentes excessivamente leves que foram absorvidos junto com C₃/C₄.</p>\n\n        <h3>O que queremos remover?</h3>\n        <ul>\n          <li>H₂</li>\n          <li>CH₄ (metano)</li>\n          <li>C₂H₆ / C₂H₄ (etano / eteno)</li>\n        </ul>\n\n        <h3>O que queremos manter no líquido?</h3>\n        <ul>\n          <li>C₃H₈ / C₃H₆ (propano / propeno)</li>\n          <li>C₄H₁₀ / C₄H₈ (butanos / butenos)</li>\n          <li>C₅+ e componentes mais pesados</li>\n        </ul>\n\n        <h3>Equilíbrio de stripping</h3>\n        <div class=\"eq\">CH₄(l) ⇌ CH₄(g)</div>\n        <div class=\"eq\">C₂H₆(l) ⇌ C₂H₆(g)</div>\n        <div class=\"eq\">C₂H₄(l) ⇌ C₂H₄(g)</div>\n\n        <p>Com o aumento de temperatura, os componentes mais voláteis tendem a migrar para a fase vapor e subir na torre.</p>\n\n        <div class=\"note\"><strong>Memorização:</strong> E-3905 = “tirar C₁/C₂ do líquido e preservar C₃/C₄”.</div>\n        "}, "j3917": {"title": "J-3917 — Bomba do pumparound da E-3904", "subtitle": "Circula líquido para resfriamento e controle térmico da absorvedora.", "html": "\n        <h3>Função da J-3917</h3>\n        <p>A <strong>J-3917</strong> recircula líquido da absorvedora através do circuito de resfriamento associado ao <strong>C-3911 A/B</strong>, formando um pumparound.</p>\n\n        <h3>Sequência</h3>\n        <div class=\"flow\">E-3904 → J-3917 → C-3911 A/B → retorno à E-3904</div>\n\n        <h3>Por que isso é importante?</h3>\n        <p>A absorção libera calor e a temperatura da torre pode subir. Como temperaturas menores favorecem a solubilidade de C₃/C₄ no líquido, o resfriamento melhora a eficiência da absorção.</p>\n\n        <div class=\"eq\">T ↓  →  absorção de C₃/C₄ ↑</div>\n        <div class=\"eq\">T ↑  →  absorção de C₃/C₄ ↓</div>\n\n        <h3>Impacto de perda da J-3917</h3>\n        <ul>\n          <li>Aumento de temperatura na região da absorvedora.</li>\n          <li>Menor capacidade de absorção.</li>\n          <li>Maior perda de C₃/C₄ pelo gás de topo.</li>\n        </ul>\n\n        <div class=\"note\"><strong>Resumo:</strong> J-3917 ajuda a controlar a temperatura para manter alta a recuperação de GLP.</div>\n        "}, "c3911": {"title": "C-3911 A/B — Resfriamento do pumparound", "subtitle": "Remove calor da corrente recirculada pela J-3917.", "html": "\n        <h3>Função</h3>\n        <p>O <strong>C-3911 A/B</strong> resfria a corrente recirculada pela J-3917 antes de seu retorno à E-3904.</p>\n\n        <h3>Efeito no processo</h3>\n        <div class=\"eq\">Remoção de calor → T do líquido ↓ → solubilidade de C₃/C₄ ↑</div>\n\n        <p>Esse resfriamento controla o perfil térmico da absorvedora e reduz a tendência de C₃/C₄ permanecerem na fase gasosa.</p>\n\n        <div class=\"note\"><strong>Importância:</strong> indisponibilidade ou baixa eficiência do C-3911 A/B pode elevar a temperatura da absorvedora e aumentar perdas pelo topo.</div>\n        "}, "c3913": {"title": "C-3913 A/B — Fornecimento de calor à retificadora", "subtitle": "Favorece a remoção dos componentes mais leves na E-3905.", "html": "\n        <h3>Função</h3>\n        <p>O <strong>C-3913 A/B</strong> está associado ao aquecimento da região inferior da E-3905. O fornecimento de calor promove a vaporização preferencial dos componentes mais leves.</p>\n\n        <h3>Princípio</h3>\n        <div class=\"eq\">T ↑ → volatilização de C₁/C₂ ↑</div>\n\n        <p>Assim, H₂, CH₄ e C₂ tendem a seguir para cima, enquanto C₃/C₄ e componentes mais pesados permanecem preferencialmente na fase líquida.</p>\n\n        <div class=\"note\"><strong>Resumo:</strong> C-3913 A/B fornece a energia necessária para a ação de stripping/retificação.</div>\n        "}, "summary": {"title": "Resumo — E-3904 + E-3905", "subtitle": "Absorção e retificação trabalhando de forma complementar.", "html": "\n        <h3>Visão integrada</h3>\n        <div class=\"process-grid\">\n          <div><strong>E-3904 — Absorção</strong><br><span>Gás → líquido</span><br>Recupera C₃/C₄.</div>\n          <div><strong>E-3905 — Retificação</strong><br><span>Líquido → gás</span><br>Remove C₁/C₂.</div>\n        </div>\n\n        <h3>Fluxo conceitual</h3>\n        <div class=\"flow\">Gás rico → E-3904 → recuperação C₃/C₄ → E-3905 → remoção C₁/C₂ → líquido rico em C₃/C₄/C₅+</div>\n\n        <h3>Absorventes</h3>\n        <ul>\n          <li><strong>Gasolina desbutanizada:</strong> absorvente mais leve e lean para C₃/C₄.</li>\n          <li><strong>Óleo da J-3905:</strong> absorvente mais pesado e complementar.</li>\n        </ul>\n\n        <h3>Controle térmico</h3>\n        <ul>\n          <li><strong>J-3917 + C-3911 A/B:</strong> removem calor da absorvedora.</li>\n          <li><strong>C-3913 A/B:</strong> fornece calor à retificadora.</li>\n        </ul>\n\n        <div class=\"note\"><strong>Ideia central:</strong> a E-3904 recupera GLP do gás; a E-3905 limpa o líquido recuperado, retirando os componentes leves demais.</div>\n        "}};
const panel = document.getElementById('panel');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const body = document.getElementById('body');
const editBtn = document.getElementById('editBtn');
const minBtn = document.getElementById('minBtn');
const closeBtn = document.getElementById('closeBtn');
const saveBtn = document.getElementById('saveBtn');
const resetBtn = document.getElementById('resetBtn');
const summaryBtn = document.getElementById('summaryBtn');
const toast = document.getElementById('toast');
let currentId = null;
let editMode = false;

function keyFor(id) { return 'e3904-e3905-content-' + id; }
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1300);
}
function persistCurrent(silent=false) {
  if (!currentId || !editMode) return;
  localStorage.setItem(keyFor(currentId), body.innerHTML);
  if (!silent) showToast('Alterações salvas');
}
function highlight(id) {
  document.querySelectorAll('.lamp').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
}
function render(id) {
  currentId = id;
  highlight(id);
  panel.classList.remove('minimized');
  minBtn.textContent = '—';
  title.textContent = DATA[id].title;
  subtitle.textContent = DATA[id].subtitle;
  const saved = localStorage.getItem(keyFor(id));
  body.innerHTML = saved !== null ? saved : DATA[id].html;
  body.contentEditable = editMode ? 'true' : 'false';
  panel.classList.add('open');
  body.animate([{opacity:.2,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],{duration:160,easing:'ease-out'});
}
function openItem(id) {
  if (!DATA[id]) return;
  if (currentId && currentId !== id) {
    persistCurrent(true);
    panel.classList.add('switching');
    setTimeout(()=>{
      panel.classList.remove('switching');
      render(id);
    },140);
  } else {
    render(id);
  }
}
document.querySelectorAll('.lamp').forEach(el=>el.addEventListener('click',()=>openItem(el.dataset.id)));
summaryBtn.addEventListener('click',()=>openItem('summary'));

editBtn.addEventListener('click',()=>{
  editMode = !editMode;
  document.body.classList.toggle('editmode',editMode);
  editBtn.classList.toggle('active',editMode);
  editBtn.textContent = editMode ? 'Edição ativa' : 'Modo edição';
  if (currentId) body.contentEditable = editMode ? 'true':'false';
  showToast(editMode ? 'Modo edição ativado' : 'Modo edição desativado');
});
saveBtn.addEventListener('click',()=>{
  if (!currentId) return;
  localStorage.setItem(keyFor(currentId),body.innerHTML);
  showToast('Alterações salvas');
});
resetBtn.addEventListener('click',()=>{
  if (!currentId) return;
  if (!confirm('Restaurar o conteúdo original deste item?')) return;
  localStorage.removeItem(keyFor(currentId));
  body.innerHTML = DATA[currentId].html;
  body.contentEditable = editMode ? 'true':'false';
  showToast('Conteúdo original restaurado');
});
minBtn.addEventListener('click',()=>{
  panel.classList.toggle('minimized');
  minBtn.textContent = panel.classList.contains('minimized') ? '□' : '—';
});
closeBtn.addEventListener('click',()=>{
  persistCurrent(true);
  panel.classList.remove('open','minimized');
  highlight(null);
  currentId = null;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBtn.click();});
</script>

<button id="pwaInstallBtn" aria-label="Instalar E-3904/05 concept">📲 Instalar E-3904/05 concept</button>


<script>
let deferredInstallPrompt = null;
const pwaInstallBtn = document.getElementById('pwaInstallBtn');

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  if (pwaInstallBtn) pwaInstallBtn.classList.add('show');
});

if (pwaInstallBtn) {
  pwaInstallBtn.addEventListener('click', async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      pwaInstallBtn.classList.remove('show');
    } else {
      const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if (isiOS) {
        alert('No iPhone/iPad: toque em Compartilhar e depois em “Adicionar à Tela de Início”.');
      } else {
        alert('Se a instalação não abrir automaticamente, use o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.');
      }
    }
  });
}

window.addEventListener('appinstalled', () => {
  if (pwaInstallBtn) pwaInstallBtn.classList.remove('show');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.log('Falha ao registrar Service Worker:', err);
    });
  });
}
</script>
